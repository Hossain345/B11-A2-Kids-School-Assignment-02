<!-- Main HTML structure for the school website hero section -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Website</title>

<!-- for font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

<!-- for css -->
    <link rel="stylesheet" href="../project-style/style.css">
    
<!-- for icon -->
    <script src="https://kit.fontawesome.com/5b2ad534c9.js" crossorigin="anonymous"></script>

</head>
<body class="quicksand-primary-font">
<!-- Header Navigation Section -->
    <header>
<!-- Logo and Brand Section -->
        <div class="area-size">
            <div class="logo">
                <img src="../assets/logo.png" alt="School Logo">
                <span class="brand-name">SCHOOL</span>
            </div>

    <!-- Navigation Menu -->
            <div>
                <nav class="nav-menu">
                <a href="#" class="nav-link color1">Home</a>
                <a href="#" class="nav-link color2">About</a>
                <a href="#" class="nav-link color3">Facilities</a>
                <a href="#" class="nav-link color4">Admission</a>
                </nav>
            </div>
    <!-- Nevigation contact btn and hamburger icon -->
            <div>
                <a href="#" class="contact-btn">Contact</a>
                    <div class="hamburger">
                        <i class="fa-solid fa-bars"></i>
                    </div>
            </div>
        </div>
    </header>

<!-- Hero Section -->
    <section class="hero area-size">
<!-- Left Content Area -->
        <div class="hero-content">
            <h1 class="hero-title">
                <span class="highlight-orange">Empowering</span>
                students from small <br>age <span class="highlight-blue">towards vision</span>
            </h1>
            <p class="hero-description">
                With the courage, Confidence, Creativity and Compassion to make 
                their Unique Contribution in a Diverse and Dynamic World.
            </p>
            <button class="enroll-btn">Enroll Now</button>
        </div>

<!-- Right Image Area -->
        <div class="hero-image">
            <img src="../assets/hero-kids.png" alt="Student Hero">
        </div>
    </section>

<!-- card section standard curriculum -->
</body>
</html>
